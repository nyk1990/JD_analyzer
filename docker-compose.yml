services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: jd-analyzer-db
    environment:
      POSTGRES_DB: jd_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jd_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
