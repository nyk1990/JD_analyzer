spring:
  application:
    name: jd-analyzer
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jd_analyzer}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
        max-tokens: 1500

app:
  embedding:
    # all-MiniLM-L6-v2 (384 dims), run locally on ONNX Runtime. Downloaded once (~90 MB) into cache-dir.
    model-uri: https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
    tokenizer-uri: https://raw.githubusercontent.com/spring-projects/spring-ai/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
    cache-dir: ~/.jd-analyzer/models
  matching:
    # Cosine similarity at or above this counts a JD requirement as "covered".
    # all-MiniLM-L6-v2 scores for genuinely related sentences usually land ~0.45-0.75; tune in session 4.
    coverage-threshold: 0.50
    max-requirements: 40
    min-chunk-length: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.nkharade.jdanalyzer: DEBUG